<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>우리집 자산 대시보드</title>
<style>
  :root {
    --surface-1: #fcfcfb; --page: #f9f9f7;
    --ink-1: #0b0b0b; --ink-2: #52514e; --ink-muted: #898781;
    --grid: #e1e0d9; --baseline: #c3c2b7; --border: rgba(11,11,11,0.10);
    --up: #006300; --down: #d03b3b;
    --c-re: #2a78d6; --c-us: #1baf7a; --c-kr: #eda100; --c-cash: #008300;
    --c-vi: #4a3aa7; --c-debt: #b0524f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-1: #1a1a19; --page: #0d0d0d;
      --ink-1: #ffffff; --ink-2: #c3c2b7; --ink-muted: #898781;
      --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
      --up: #0ca30c; --down: #e66767;
      --c-re: #3987e5; --c-us: #199e70; --c-kr: #c98500; --c-cash: #008300;
      --c-vi: #9085e9; --c-debt: #d08a88;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--page); color: var(--ink-1);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 20px; max-width: 1080px; margin: 0 auto;
  }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; margin-bottom: 18px; }
  h1 { font-size: 20px; font-weight: 700; }
  .meta { color: var(--ink-muted); font-size: 12.5px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 18px;
  }
  .card .label { font-size: 12.5px; color: var(--ink-2); margin-bottom: 6px; }
  .card .value { font-size: 26px; font-weight: 700; line-height: 1.15; }
  .card.hero .value { font-size: 40px; }
  .card .sub { font-size: 12.5px; color: var(--ink-muted); margin-top: 6px; }
  .delta-up { color: var(--up); } .delta-down { color: var(--down); }
  section.card { margin-bottom: 14px; }
  h2 { font-size: 14px; font-weight: 600; color: var(--ink-2); margin-bottom: 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 12.5px; color: var(--ink-2); margin-top: 12px; justify-content: center; }
  .legend span { white-space: nowrap; }
  .legend span::before {
    content: ""; display: inline-block; width: 10px; height: 10px;
    border-radius: 3px; margin-right: 5px; background: var(--sw); vertical-align: 0px;
  }
  .donut-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 8px; }
  .donut-cell { display: flex; flex-direction: column; align-items: center; padding: 6px 4px 2px; }
  .donut-cell h3 { font-size: 13px; font-weight: 600; color: var(--ink-1); margin-bottom: 2px; text-align: center; }
  .donut-cell .cap { font-size: 11.5px; color: var(--ink-muted); margin-bottom: 8px; text-align: center; min-height: 15px; }
  svg text { font-family: inherit; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
  th { color: var(--ink-muted); font-weight: 500; font-size: 12px; border-bottom: 1px solid var(--baseline); }
  th:first-child, td:first-child { text-align: left; }
  td.name { font-weight: 600; }
  td .chip { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; }
  #tooltip {
    position: fixed; pointer-events: none; z-index: 10; display: none;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 12.5px; box-shadow: 0 4px 14px rgba(0,0,0,.15);
    color: var(--ink-1);
  }
  /* 탭 */
  .tabs { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--border); }
  .tab {
    background: none; border: none; cursor: pointer; font-family: inherit;
    font-size: 14px; font-weight: 600; color: var(--ink-muted);
    padding: 9px 14px; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab:hover { color: var(--ink-2); }
  .tab.on { color: var(--c-re); border-bottom-color: var(--c-re); }
  /* 배당 카드 */
  .div-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  .div-card { background: var(--page); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .div-card .who { font-size: 12.5px; color: var(--ink-2); margin-bottom: 6px; }
  .div-card .amt { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .div-card .mo { font-size: 11.5px; color: var(--ink-muted); margin-top: 4px; }
  /* 스택 바 (연금성/유동성) */
  .sb { margin-bottom: 14px; }
  .sb-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; margin-bottom: 6px; }
  .sb-head b { font-weight: 600; }
  .sb-track { display: flex; height: 22px; border-radius: 6px; overflow: hidden; background: var(--grid); }
  .sb-seg { display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; }
  /* FIRE 목표 */
  .fire-goals { display: grid; gap: 15px; }
  .goal-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 13px; margin-bottom: 6px; }
  .goal-head .gl { color: var(--ink-1); }
  .goal-head .gl small { color: var(--ink-muted); font-weight: 400; }
  .goal-head .pct { font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .goal-track { height: 10px; background: var(--grid); border-radius: 6px; overflow: hidden; }
  .goal-fill { height: 100%; border-radius: 6px; transition: width .5s ease; }
  .goal-sub { font-size: 11.5px; color: var(--ink-muted); margin-top: 5px; }
  .fire-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 10px; margin-top: 18px; }
  .fact { background: var(--page); border: 1px solid var(--border); border-radius: 8px; padding: 11px 13px; }
  .fact .l { font-size: 11.5px; color: var(--ink-2); margin-bottom: 4px; }
  .fact .v { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .fact .s { font-size: 11px; color: var(--ink-muted); margin-top: 3px; }
  #err { color: var(--down); padding: 30px 10px; font-size: 14px; display: none; }
  #gate {
    position: fixed; inset: 0; background: var(--page); z-index: 20;
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
  }
  #gate .box {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 28px; width: min(340px, 90vw); display: flex; flex-direction: column; gap: 12px;
  }
  #gate h2 { margin: 0; }
  #gate input {
    font-size: 16px; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--baseline); background: var(--page); color: var(--ink-1);
  }
  #gate button {
    font-size: 15px; font-weight: 600; padding: 10px; border-radius: 8px; border: none;
    background: var(--c-re); color: #fff; cursor: pointer;
  }
  #gate .msg { font-size: 13px; color: var(--down); min-height: 18px; }
</style>
</head>
<body>
<header>
  <h1>우리집 자산 대시보드</h1>
  <span class="meta" id="updated"></span>
  <span class="meta" id="fx"></span>
</header>

<div id="gate" style="display:none">
  <div class="box">
    <h2>비밀번호 입력</h2>
    <input type="password" id="pw" placeholder="공유한 비밀번호" autocomplete="current-password">
    <button id="pwbtn">열기</button>
    <div class="msg" id="pwmsg"></div>
  </div>
</div>

<div id="err"></div>

<nav class="tabs" id="tabs" style="display:none">
  <button class="tab on" data-tab="overview">자산 현황</button>
  <button class="tab" data-tab="financial">금융자산</button>
</nav>

<div id="tab-overview">
  <div class="cards" id="kpis"></div>

  <section class="card" id="fire-section" style="display:none">
    <h2>FIRE 목표 달성</h2>
    <div id="fire-body"></div>
  </section>

  <section class="card">
    <h2>자산 구성</h2>
    <div class="donut-row" id="donuts"></div>
  </section>

  <section class="card">
    <h2>순자산 추이</h2>
    <div id="trend"></div>
  </section>

  <section class="card">
    <h2>자산 상세</h2>
    <div style="overflow-x:auto"><table id="detail"></table></div>
  </section>
</div>

<div id="tab-financial" style="display:none">
  <div class="cards" id="fin-kpis"></div>

  <section class="card">
    <h2>포트폴리오 구성</h2>
    <div class="donut-row" id="fin-donuts"></div>
  </section>

  <section class="card">
    <h2>계좌 성격 — 연금성 vs 유동성</h2>
    <div id="fin-groups"></div>
    <div class="goal-sub" style="margin-top:10px">연금성 = 연저펀·IRP·퇴직연금 (인출 제약) · 유동성 = ISA·CMA·청약·현금</div>
  </section>

  <section class="card">
    <h2>연 예상 배당금</h2>
    <div class="div-row" id="fin-div"></div>
    <div class="goal-sub" style="margin-top:10px">최근 12개월 실지급 배당(주당) × 보유수량 기준 · USD 종목은 현재 환율 적용</div>
  </section>

  <section class="card">
    <h2>계좌별 상세</h2>
    <div style="overflow-x:auto"><table id="fin-detail"></table></div>
  </section>
</div>

<div id="tooltip"></div>

<script>
const CAT_COLORS = {
  "부동산":     "var(--c-re)",
  "주식":       "var(--c-us)",
  "전세보증금": "var(--c-kr)",
  "현금":       "var(--c-cash)",
  "미국주식":   "var(--c-us)",
  "한국주식":   "var(--c-kr)",
  "기타":       "var(--baseline)",
};
const CATS = ["부동산", "주식", "전세보증금", "현금"];
const fmtEok = v => (v / 1e8).toLocaleString("ko-KR", { maximumFractionDigits: 2 }) + "억";
const fmtWon = v => Math.round(v).toLocaleString("ko-KR") + "원";
const tooltip = document.getElementById("tooltip");

function showTip(ev, html) {
  tooltip.innerHTML = html;
  tooltip.style.display = "block";
  const pad = 14;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  const r = tooltip.getBoundingClientRect();
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - pad;
  tooltip.style.left = x + "px"; tooltip.style.top = y + "px";
}
function hideTip() { tooltip.style.display = "none"; }

function el(tag, attrs = {}, parent) {
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (parent) parent.appendChild(n);
  return n;
}

/* ---- 도넛 차트 (중앙 합계 + 범례 + 툴팁) ---- */
function arcPath(cx, cy, rO, rI, a0, a1) {
  const pt = (r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  const large = (a1 - a0) > Math.PI ? 1 : 0;
  const [x0, y0] = pt(rO, a0), [x1, y1] = pt(rO, a1);
  const [x2, y2] = pt(rI, a1), [x3, y3] = pt(rI, a0);
  return `M${x0} ${y0} A${rO} ${rO} 0 ${large} 1 ${x1} ${y1} L${x2} ${y2} A${rI} ${rI} 0 ${large} 0 ${x3} ${y3} Z`;
}

function donut(cell, spec) {
  // spec: {title, caption, center, centerLabel, slices:[{label,value,color,neg}]}
  cell.innerHTML = "";
  const h3 = document.createElement("h3"); h3.textContent = spec.title; cell.appendChild(h3);
  const cap = document.createElement("div"); cap.className = "cap"; cap.textContent = spec.caption || ""; cell.appendChild(cap);

  const slices = spec.slices.filter(s => Math.abs(s.value) > 0);
  const total = slices.reduce((s, x) => s + Math.abs(x.value), 0) || 1;
  const size = 200, cx = 100, cy = 100, rO = 84, rI = 55, gap = 0.025;
  const svg = el("svg", { viewBox: `0 0 ${size} ${size}`, style: "width:100%;max-width:200px;display:block" });
  let ang = -Math.PI / 2;
  for (const s of slices) {
    const frac = Math.abs(s.value) / total;
    const a0 = ang + gap / 2, a1 = ang + frac * 2 * Math.PI - gap / 2;
    if (a1 > a0) {
      const p = el("path", { d: arcPath(cx, cy, rO, rI, a0, a1), fill: s.color,
        stroke: "var(--surface-1)", "stroke-width": 1 }, svg);
      const sign = s.neg ? "−" : "";
      p.addEventListener("mousemove", ev => showTip(ev,
        `<b>${s.label}</b><br>${sign}${fmtEok(Math.abs(s.value))} (${(frac * 100).toFixed(1)}%)` +
        `<br><span style="color:var(--ink-muted)">${sign}${fmtWon(Math.abs(s.value))}</span>`));
      p.addEventListener("mouseleave", hideTip);
    }
    ang += frac * 2 * Math.PI;
  }
  el("text", { x: cx, y: cy - 1, "text-anchor": "middle", "font-size": 21, "font-weight": 700, fill: "var(--ink-1)" }, svg)
    .textContent = fmtEok(spec.center);
  el("text", { x: cx, y: cy + 16, "text-anchor": "middle", "font-size": 11, fill: "var(--ink-muted)" }, svg)
    .textContent = spec.centerLabel || "";
  cell.appendChild(svg);

  const lg = document.createElement("div"); lg.className = "legend";
  for (const s of slices) {
    const span = document.createElement("span"); span.style.setProperty("--sw", s.color);
    span.textContent = `${s.label} ${(s.neg ? "−" : "")}${(Math.abs(s.value) / total * 100).toFixed(1)}%`;
    lg.appendChild(span);
  }
  cell.appendChild(lg);
}

function donutCell(parent) {
  const c = document.createElement("div"); c.className = "donut-cell";
  parent.appendChild(c); return c;
}

/* ---- 추이 라인 차트 (크로스헤어 + 툴팁) ---- */
function lineChart(container, points) {
  // points: [{date, total}]
  const W = Math.min(container.clientWidth || 900, 1000), H = 240;
  const m = { l: 56, r: 16, t: 12, b: 26 };
  const svg = el("svg", { width: "100%", viewBox: `0 0 ${W} ${H}` });
  if (points.length === 0) { container.textContent = "이력 데이터가 아직 없습니다."; return; }
  const vals = points.map(p => p.total);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi) { lo *= 0.97; hi *= 1.03; }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const xs = i => points.length === 1 ? (m.l + W - m.r) / 2
    : m.l + (W - m.l - m.r) * i / (points.length - 1);
  const ys = v => m.t + (H - m.t - m.b) * (1 - (v - lo) / (hi - lo));
  // gridlines + y labels
  for (let g = 0; g <= 3; g++) {
    const v = lo + (hi - lo) * g / 3, y = ys(v);
    el("line", { x1: m.l, x2: W - m.r, y1: y, y2: y, stroke: "var(--grid)", "stroke-width": 1 }, svg);
    const t = el("text", { x: m.l - 8, y: y + 4, "text-anchor": "end", "font-size": 11, fill: "var(--ink-muted)" }, svg);
    t.textContent = fmtEok(v);
  }
  // x labels — 연말은 "YYYY", 그 외는 "YY.MM". 겹치지 않게 최대 ~8개 균등 표시.
  const xlab = date => {
    const [y, mo, d] = date.split("-");
    return (mo === "12" && d === "31") ? y : y.slice(2) + "." + mo;
  };
  const step = Math.max(1, Math.ceil(points.length / 8));
  const xIdx = new Set();
  for (let i = 0; i < points.length; i += step) xIdx.add(i);
  xIdx.add(points.length - 1);
  for (const i of xIdx) {
    const t = el("text", { x: xs(i), y: H - 6, "text-anchor": "middle", "font-size": 11, fill: "var(--ink-muted)" }, svg);
    t.textContent = xlab(points[i].date);
  }
  if (points.length > 1) {
    const d = points.map((p, i) => (i ? "L" : "M") + xs(i).toFixed(1) + " " + ys(p.total).toFixed(1)).join(" ");
    el("path", { d, fill: "none", stroke: "var(--c-re)", "stroke-width": 2, "stroke-linejoin": "round" }, svg);
  }
  const dotR = points.length <= 40 ? 3.5 : 0;
  if (dotR) points.forEach((p, i) =>
    el("circle", { cx: xs(i), cy: ys(p.total), r: dotR, fill: "var(--c-re)", stroke: "var(--surface-1)", "stroke-width": 2 }, svg));
  // crosshair
  const cross = el("line", { y1: m.t, y2: H - m.b, stroke: "var(--baseline)", "stroke-width": 1, visibility: "hidden" }, svg);
  const hot = el("circle", { r: 5, fill: "var(--c-re)", stroke: "var(--surface-1)", "stroke-width": 2, visibility: "hidden" }, svg);
  svg.addEventListener("mousemove", ev => {
    const box = svg.getBoundingClientRect();
    const px = (ev.clientX - box.left) * W / box.width;
    let best = 0, bd = 1e9;
    points.forEach((_, i) => { const d = Math.abs(xs(i) - px); if (d < bd) { bd = d; best = i; } });
    const p = points[best];
    cross.setAttribute("x1", xs(best)); cross.setAttribute("x2", xs(best));
    cross.setAttribute("visibility", "visible");
    hot.setAttribute("cx", xs(best)); hot.setAttribute("cy", ys(p.total));
    hot.setAttribute("visibility", "visible");
    showTip(ev, `<b>${p.date}</b><br>순자산 ${fmtEok(p.total)}<br><span style="color:var(--ink-muted)">${fmtWon(p.total)}</span>`);
  });
  svg.addEventListener("mouseleave", () => { cross.setAttribute("visibility", "hidden"); hot.setAttribute("visibility", "hidden"); hideTip(); });
  container.replaceChildren(svg);
}

function kpiCard(label, value, sub, hero) {
  return `<div class="card${hero ? " hero" : ""}">
    <div class="label">${label}</div><div class="value">${value}</div>
    ${sub ? `<div class="sub">${sub}</div>` : ""}</div>`;
}

/* ---- FIRE 목표 달성 (★종합 시트 목표 + 실시간 순자산 달성률) ---- */
function renderFire(f, net) {
  const sec = document.getElementById("fire-section");
  if (!f || !f.target_basic) { sec.style.display = "none"; return; }
  sec.style.display = "";

  const goal = (label, note, target, color) => {
    const pct = target > 0 ? net / target * 100 : 0;
    const remain = target - net;
    return `<div>
      <div class="goal-head">
        <span class="gl">${label} <small>· ${note} · 목표 ${fmtEok(target)}</small></span>
        <span class="pct" style="color:${color}">${pct.toFixed(1)}%</span>
      </div>
      <div class="goal-track"><div class="goal-fill" style="width:${Math.min(100, pct).toFixed(1)}%;background:${color}"></div></div>
      <div class="goal-sub">${remain > 0 ? "남은 목표 " + fmtEok(remain) : "목표 달성 🎉 (+" + fmtEok(-remain) + ")"}</div>
    </div>`;
  };

  let html = `<div class="fire-goals">
    ${goal("기본 루트", "기대수명까지 소진", f.target_basic, "var(--c-us)")}
    ${goal("부자 루트", "자산 유지·증식", f.target_rich, "var(--c-vi)")}
  </div>`;

  const facts = [];
  if (f.target_year) {
    const dday = Math.round((new Date(f.target_year, 11, 31) - new Date()) / 864e5);
    const sub = dday > 0 ? `D-${dday} · ${Math.floor(dday / 365)}년 ${Math.floor(dday % 365 / 30)}개월` : "목표 시점 도래";
    facts.push(["은퇴 목표", `${f.retire_age ? f.retire_age + "세 · " : ""}${f.target_year}년`, sub]);
  }
  if (f.monthly_expense) facts.push(["은퇴 후 월생활비", fmtWon(f.monthly_expense), "물가 반영"]);
  if (f.depletion_age) facts.push(["자산 소진 예상", `${f.depletion_age}세`, f.life_expectancy ? `기대수명 ${f.life_expectancy}세` : ""]);
  if (f.real_return) facts.push(["세후 실질수익률", `${f.real_return}%`, "연 가정치"]);
  if (facts.length)
    html += `<div class="fire-facts">${facts.map(([l, v, s]) =>
      `<div class="fact"><div class="l">${l}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ""}</div>`).join("")}</div>`;

  html += `<div class="goal-sub" style="margin-top:13px">출처: ⭐️분당부부_MASTER ★종합 · 목표·가정치는 시트값, 달성률은 현재 순자산으로 실시간 재계산</div>`;
  document.getElementById("fire-body").innerHTML = html;
}

/* ---- 금융자산 탭 (★주식계좌 원 소스) ---- */
const TCOL = {
  "KRX:360750": "#3182F6", "KRX:379810": "#7048E8", "KRX:435420": "#0CA678",
  "KRX:458730": "#F59F00", "KRX:148020": "#E64980", "KRX:161510": "#37B24D",
  "SCHD": "#1098AD",
};
const colorOf = t => TCOL[t] || "var(--baseline)";
const fmtMan = v => Math.round(v / 1e4).toLocaleString("ko-KR") + "만원";

function byName(hs) {
  const m = new Map();
  for (const h of hs) {
    if (!(h.value_krw > 0)) continue;
    const k = h.name || h.account;
    const cur = m.get(k) || { value: 0, ticker: h.ticker };
    cur.value += h.value_krw;
    m.set(k, cur);
  }
  return [...m.entries()].sort((a, b) => b[1].value - a[1].value);
}
const sum = (hs, f = h => h.value_krw) => hs.reduce((s, h) => s + f(h), 0);

function portfolioDonut(cell, title, hs) {
  const total = sum(hs);
  if (total <= 0) {
    cell.innerHTML = `<h3>${title}</h3><div class="cap">보유내역 입력 전</div>
      <div style="height:150px;display:flex;align-items:center;color:var(--ink-muted);font-size:12.5px">—</div>`;
    return;
  }
  donut(cell, {
    title, caption: "종목별 평가액", center: total, centerLabel: "금융자산",
    slices: byName(hs).map(([name, o]) => ({ label: name, value: o.value, color: colorOf(o.ticker) })),
  });
}

function stackBar(label, pension, liquid) {
  const tot = pension + liquid;
  if (tot <= 0) return "";
  const pp = pension / tot * 100, lp = liquid / tot * 100;
  return `<div class="sb">
    <div class="sb-head"><b>${label}</b><span style="color:var(--ink-muted)">${fmtEok(tot)}</span></div>
    <div class="sb-track">
      ${pension > 0 ? `<div class="sb-seg" style="width:${pp}%;background:var(--c-vi)">${pp >= 10 ? pp.toFixed(0) + "%" : ""}</div>` : ""}
      ${liquid > 0 ? `<div class="sb-seg" style="width:${lp}%;background:var(--c-us)">${lp >= 10 ? lp.toFixed(0) + "%" : ""}</div>` : ""}
    </div>
    <div class="goal-sub">연금성 ${fmtEok(pension)} · 유동성 ${fmtEok(liquid)}</div>
  </div>`;
}

function renderFinancial(fin) {
  const H = (fin && fin.holdings) || [];
  if (!H.length) {
    document.getElementById("tab-financial").innerHTML =
      `<section class="card"><h2>금융자산</h2>
       <div class="goal-sub">★주식계좌 시트를 불러오지 못했어요.</div></section>`;
    return;
  }
  const uh = H.filter(h => h.owner === "우현"), gr = H.filter(h => h.owner === "규리");
  const totAll = sum(H), divAll = sum(H, h => h.div_krw);
  const pens = sum(H.filter(h => h.group === "연금성")), liq = totAll - pens;

  // KPI
  document.getElementById("fin-kpis").innerHTML =
    kpiCard("금융자산 총액", fmtEok(totAll), `우현 ${fmtEok(sum(uh))} · 규리 ${fmtEok(sum(gr))}`, true) +
    kpiCard("연 예상 배당금", fmtMan(divAll), `월 ${fmtMan(divAll / 12)} · 수익률 ${(divAll / totAll * 100).toFixed(2)}%`) +
    kpiCard("연금성 비중", (pens / totAll * 100).toFixed(1) + "%", `연금성 ${fmtEok(pens)} · 유동성 ${fmtEok(liq)}`);

  // 포트폴리오 도넛 3종
  const dc = document.getElementById("fin-donuts");
  dc.innerHTML = "";
  portfolioDonut(donutCell(dc), "우리 (부부 합산)", H);
  portfolioDonut(donutCell(dc), "우현", uh);
  portfolioDonut(donutCell(dc), "규리", gr);

  // 연금성 vs 유동성
  const g = (hs, kind) => sum(hs.filter(h => h.group === kind));
  document.getElementById("fin-groups").innerHTML =
    stackBar("우리", pens, liq) +
    stackBar("우현", g(uh, "연금성"), g(uh, "유동성")) +
    stackBar("규리", g(gr, "연금성"), g(gr, "유동성"));

  // 배당 카드
  const divCard = (who, hs) => {
    const amt = sum(hs, h => h.div_krw), base = sum(hs);
    return `<div class="div-card"><div class="who">${who}</div>
      <div class="amt">${fmtMan(amt)}</div>
      <div class="mo">월 ${fmtMan(amt / 12)} · 수익률 ${base > 0 ? (amt / base * 100).toFixed(2) : "0.00"}%</div></div>`;
  };
  document.getElementById("fin-div").innerHTML =
    divCard("우리 (부부 합산)", H) + divCard("우현", uh) + divCard("규리", gr);

  // 계좌별 상세
  const am = new Map();
  for (const h of H) {
    const k = h.owner + "|" + h.account;
    const c = am.get(k) || { owner: h.owner, account: h.account, group: h.group, value: 0, div: 0 };
    c.value += h.value_krw; c.div += h.div_krw;
    am.set(k, c);
  }
  const rows = [...am.values()].filter(a => a.value > 0).sort((a, b) => b.value - a.value).map(a => `
    <tr><td class="name">${a.account}</td><td>${a.owner}</td>
      <td><span class="chip" style="background:${a.group === "연금성" ? "var(--c-vi)" : "var(--c-us)"}"></span>${a.group}</td>
      <td><b>${fmtEok(a.value)}</b></td>
      <td style="color:var(--ink-muted)">${a.div > 0 ? fmtMan(a.div) : "—"}</td></tr>`).join("");
  document.getElementById("fin-detail").innerHTML =
    `<thead><tr><th>계좌</th><th>소유</th><th>성격</th><th>평가액</th><th>연 배당</th></tr></thead><tbody>${rows}</tbody>`;
}

function initTabs() {
  const nav = document.getElementById("tabs");
  nav.style.display = "flex";
  nav.addEventListener("click", ev => {
    const b = ev.target.closest(".tab");
    if (!b) return;
    for (const t of nav.querySelectorAll(".tab")) t.classList.toggle("on", t === b);
    document.getElementById("tab-overview").style.display = b.dataset.tab === "overview" ? "" : "none";
    document.getElementById("tab-financial").style.display = b.dataset.tab === "financial" ? "" : "none";
  });
}

/* ---- 복호화 (scripts/crypto_util.py와 동일 포맷) ---- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decryptEnvelope(envText, passphrase) {
  const o = JSON.parse(envText);
  const raw = await crypto.subtle.importKey("raw", new TextEncoder().encode(passphrase), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(o.salt), iterations: o.iter || 600000, hash: "SHA-256" },
    raw, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(o.iv) }, key, b64(o.ct));
  return new TextDecoder().decode(pt);
}

async function loadData(passphrase) {
  const bust = "?t=" + Date.now();
  const [encSnap, encHist] = await Promise.all([
    fetch("data/latest.enc" + bust).then(r => { if (!r.ok) throw new Error("latest.enc HTTP " + r.status); return r.text(); }),
    fetch("data/history.enc" + bust).then(r => r.ok ? r.text() : ""),
  ]);
  const snap = JSON.parse(await decryptEnvelope(encSnap, passphrase));
  const histText = encHist ? await decryptEnvelope(encHist, passphrase) : "";
  return [snap, histText];
}

async function gate() {
  const g = document.getElementById("gate"), input = document.getElementById("pw"),
        btn = document.getElementById("pwbtn"), msg = document.getElementById("pwmsg");
  const saved = localStorage.getItem("asset_pw");
  if (saved) {
    try { return await loadData(saved); }
    catch { localStorage.removeItem("asset_pw"); }
  }
  g.style.display = "flex";
  return new Promise(resolve => {
    const attempt = async () => {
      const pw = input.value;
      if (!pw) return;
      btn.disabled = true; msg.textContent = "확인 중…";
      try {
        const data = await loadData(pw);
        localStorage.setItem("asset_pw", pw);
        g.style.display = "none";
        resolve(data);
      } catch (e) {
        btn.disabled = false;
        msg.textContent = String(e).includes("HTTP")
          ? "데이터 파일을 불러오지 못했습니다 (" + e + ")"
          : "비밀번호가 틀렸습니다.";
      }
    };
    btn.addEventListener("click", attempt);
    input.addEventListener("keydown", ev => { if (ev.key === "Enter") attempt(); });
    input.focus();
  });
}

async function main() {
  let snap, histText;
  try {
    [snap, histText] = await gate();
  } catch (e) {
    const err = document.getElementById("err");
    err.style.display = "block";
    err.textContent = "데이터를 불러오지 못했습니다. 로컬에서 열었다면 `python -m http.server`로 docs 폴더를 서빙해서 보세요. (" + e + ")";
    return;
  }

  document.getElementById("updated").textContent = "갱신: " + snap.updated_at;
  document.getElementById("fx").textContent = snap.fx_usdkrw
    ? "환율 " + Number(snap.fx_usdkrw).toLocaleString() + "원/$ (" + snap.fx_asof + ")"
    : "";

  // history → 일별 총자산
  const daily = new Map();
  for (const line of histText.trim().split("\n").slice(1)) {
    if (!line) continue;
    const cols = line.split(",");
    const date = cols[0], v = Number(cols[cols.length - 1]);
    daily.set(date, (daily.get(date) || 0) + v);
  }
  const hist = [...daily.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1)
    .map(([date, total]) => ({ date, total }));

  // KPI
  const net = snap.net_krw ?? snap.total_krw;
  const gross = snap.gross_krw ?? snap.assets.reduce((s, a) => s + a.value_krw, 0);
  const debt = snap.debt_krw ?? 0;
  let deltaHtml = "";
  if (hist.length >= 2) {
    const prev = hist[hist.length - 2];
    const d = net - prev.total, pct = (d / prev.total * 100).toFixed(2);
    const cls = d >= 0 ? "delta-up" : "delta-down", arrow = d >= 0 ? "▲" : "▼";
    deltaHtml = `<span class="${cls}">${arrow} ${fmtEok(Math.abs(d))} (${pct}%)</span> vs ${prev.date}`;
  }
  let cards = kpiCard("순자산", fmtEok(net), deltaHtml || "총자산 − 부채", true);
  cards += kpiCard("총자산", fmtEok(gross), "부채 제외 전");
  if (debt) cards += kpiCard("부채", "−" + fmtEok(debt), "대출·상환 예정");
  document.getElementById("kpis").innerHTML = cards;

  // FIRE 목표 달성 (★종합 시트) — 달성률은 위 실시간 net으로 재계산
  renderFire(snap.fire, net);

  // ---- 자산 구성 도넛 3종 ----
  const A = snap.assets, L = snap.liabilities || [];
  const sumV = arr => arr.reduce((s, x) => s + x.value_krw, 0);
  const sumL = arr => arr.reduce((s, x) => s + x.amount_krw, 0);
  const inCat = c => A.filter(a => a.category === c);
  const re = sumV(inCat("부동산"));
  const stockUH = sumV(A.filter(a => a.category === "주식" && a.owner === "우현"));
  const stockGR = sumV(A.filter(a => a.category === "주식" && a.owner === "규리"));
  const jeonse = sumV(inCat("전세보증금"));
  const cash = sumV(inCat("현금"));
  const rentalDep = sumL(L.filter(l => l.kind === "rental_deposit"));
  const loan = sumL(L.filter(l => l.kind === "loan"));
  const C = { re: "var(--c-re)", uh: "var(--c-us)", gr: "var(--c-vi)", jeonse: "var(--c-kr)", cash: "var(--c-cash)", debt: "var(--c-debt)" };

  // 소유자별 순자산 (공동 자산·부채는 개인에게 50:50 배분)
  const onet = {};
  for (const a of A) onet[a.owner] = (onet[a.owner] || 0) + a.value_krw;
  for (const l of L) onet[l.owner] = (onet[l.owner] || 0) - l.amount_krw;
  const joint = onet["공동"] || 0;
  const uhNet = (onet["우현"] || 0) + joint / 2;
  const grNet = (onet["규리"] || 0) + joint / 2;

  const dc = document.getElementById("donuts");
  dc.innerHTML = "";
  donut(donutCell(dc), {
    title: "총자산 배분", caption: "부채 차감 전", center: gross, centerLabel: "총자산",
    slices: [
      { label: "부동산", value: re, color: C.re },
      { label: "우현 주식", value: stockUH, color: C.uh },
      { label: "규리 주식", value: stockGR, color: C.gr },
      { label: "전세보증금", value: jeonse, color: C.jeonse },
      { label: "현금", value: cash, color: C.cash },
    ],
  });
  donut(donutCell(dc), {
    title: "순자산 배분", caption: "전세보증금은 부동산에 상계", center: net, centerLabel: "순자산",
    slices: [
      { label: "부동산 순지분", value: re - rentalDep, color: C.re },
      { label: "주식", value: stockUH + stockGR, color: C.uh },
      { label: "전세보증금", value: jeonse, color: C.jeonse },
      { label: "현금", value: cash, color: C.cash },
      { label: "대출", value: loan, color: C.debt, neg: true },
    ],
  });
  donut(donutCell(dc), {
    title: "각자 순자산 배분", caption: "공동 자산·부채 50:50 배분", center: net, centerLabel: "순자산",
    slices: [
      { label: "우현", value: uhNet, color: C.uh },
      { label: "규리", value: grNet, color: C.gr },
    ],
  });

  // 추이
  lineChart(document.getElementById("trend"), hist);

  // 금융자산 탭 (★주식계좌)
  initTabs();
  renderFinancial(snap.financial);

  // 상세 테이블 (자산 + 부채)
  const rows = [...snap.assets].sort((a, b) => b.value_krw - a.value_krw).map(a => `
    <tr>
      <td class="name"><span class="chip" style="background:${CAT_COLORS[a.category] || "var(--baseline)"}"></span>${a.name}</td>
      <td>${a.owner}</td><td>${a.category}</td>
      <td>${a.currency === "USD" ? "$" + a.price.toLocaleString() : fmtWon(a.price)}</td>
      <td><b>${fmtEok(a.value_krw)}</b></td>
      <td style="color:var(--ink-muted)">${a.asof}${a.note ? " · " + a.note : ""}</td>
    </tr>`).join("");
  const debtRows = (snap.liabilities || []).map(l => `
    <tr>
      <td class="name"><span class="chip" style="background:var(--down)"></span>${l.name}</td>
      <td>${l.owner}</td><td>부채</td>
      <td>${fmtWon(l.amount_krw)}</td>
      <td class="delta-down"><b>−${fmtEok(l.amount_krw)}</b></td>
      <td style="color:var(--ink-muted)">${l.note || ""}</td>
    </tr>`).join("");
  document.getElementById("detail").innerHTML = `
    <thead><tr><th>항목</th><th>소유</th><th>분류</th><th>금액</th><th>평가액</th><th>비고</th></tr></thead>
    <tbody>${rows}${debtRows}</tbody>`;
}
main();
</script>
