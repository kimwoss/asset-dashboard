name: update-asset-data

on:
  schedule:
    # KB시세는 매주 금요일 08:00(KST) 갱신 → 그 직후 08:30(KST) 실행
    # 금 08:30 KST = 목 23:30 UTC
    - cron: "30 23 * * 4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update data
        env:
          ASSET_PASSPHRASE: ${{ secrets.ASSET_PASSPHRASE }}
        run: python scripts/run_ci.py

      - name: Commit & push
        run: |
          git config user.name "asset-bot"
          git config user.email "actions@github.com"
          git add docs/data config/portfolio.enc
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin main
            git push
          fi
