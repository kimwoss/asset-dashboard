name: dashboard-quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
      - run: node tools/build.mjs --check
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q scripts
      - run: python -m pytest tests/test_block_cache.py tests/test_market_hours.py tests/test_simulation_reader.py tests/test_account_performance.py -q
        env:
          PYTHONPATH: scripts

